name: AnyLogic Guard

on:
  push:
    branches:
      - main
      - chore/anylogic-protection
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: anylogic-guard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run AnyLogic XML guard
        run: python scripts/check_alp_xml.py